{% extends "layout.html" %}
{% block body %}
    <section>
        <h1>Create Event</h1>
        <form method="POST">
            <div class="form-group">
                <label for="event_name">Event Name:</label>
                <input class="form-control" type="text" id="event_name" name="event_name" required>
            </div>
            
            <label >Event Type:</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="event_type" value="Party" id="party" checked>
                <label  class="form-check-label" for="party">Party</label> 
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="event_type" value="Trick or Treat group" id="trick_or_treat_group">
                <label  class="form-check-label" for="trick_or_treat_group">Trick or Treat Group</label>
            </div>
            
            <div class="form-group">
                <label for="event_location">Event Location:</label>
                <input class="form-control" type="text" id="event_location" name="event_location" required>
            </div>
            
            <button class="btn btn-primary" type="submit">Create Event</button>
        </form>
    </section>
{% endblock %}
