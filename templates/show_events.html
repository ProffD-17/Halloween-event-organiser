{% extends 'layout.html' %}
{% block body %}
    <section>
        <h1>View events</h1>
        {% if events %}
            <table class="table table-hover">
                <thead>
                    <th>Name</th>
                    <th>Info</th>
                </thead>
                <tbody>
                    {% for event in events %}
                        <tr>
                            <td>{{ event['name'] }}</td>
                            <td>
                                <form action="/event_info" method="get">
                                    <input type="hidden" value="{{ event['id'] }}" name="event_id">
                                    <button class="btn btn-primary" type="submit">Info</button>
                                </form>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No events</p>
            <a href="/create_event">Make one</a>
        {% endif %}
    </section>
{% endblock %}
