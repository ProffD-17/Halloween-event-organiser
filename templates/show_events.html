{% extends 'layout.html' %}
{% block body %}

    <h1>View events</h1>
    <table>
        <thead>
            <th>Name</th>
            <th>Time</th>
            <th>Event type</th>
            <th>Location</th>
            <th>Guests</th>
            <th>Sign up</th>
        </thead>
        <tbody>
            {% for event in events %}
                <tr>
                    <td>{{ event['name'] }}</td>
                    <td>{{ event['time'] }}</td>
                    <td>{{ event['type'] }}</td>
                    <td>{{ event['location'] }}</td>
                    <td> 
                        <form action="/guests" method="post">
                            <input type="hidden" value="{{ event['id'] }}" name="event_id">
                            <button type="submit">View guests</button>
                        </form>
                    </td>
                    <td> 
                        <form action="/attend" method="post">
                            <input type="hidden" value="{{ event['id'] }}" name="event_id">
                            <button type="submit">Sign up</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
