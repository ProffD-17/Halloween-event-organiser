{% extends 'layout.html' %}
{% block body %}

    <h1 class="text-center">{{ event_info['name'] }}</h1>
    <p>Only admins and the host of the event can edit the info.</p>
    <form action="/edit_event" method="post">
        <div class="form-group m-3">
            <label for="name" class="form-label">Name</label>
            <input class="form-control" type="text" value="{{ event_info['name'] }}" name="name" id="name" required>
        </div>

        <p class="m-1">Type</p>
        <div class="form-check form-check-inline m-3">
            <input class="form-check-input" type="radio" value="Party" name="type" id="type" required {% if event_info['type'] == 'Party' %}checked{% endif %}>
            <label for="type" class="form-check-label">Party</label>
        </div>
        <div class="form-check form-check-inline m-3">
            <input class="form-check-input" type="radio" value="Trick or Treat group" name="type" id="trick-or-treat-group" required {% if event_info['type'] == 'Trick or Treat group' %}checked{% endif %}>
            <label for="trick-or-treat-group" class="form-check-label">Trick or Treat group</label>
        </div>

        <div class="form-group m-3">
            <label for="event_time">Event Time:</label>
            <input type="time" id="event_time" name="event_time" value="{{ event_info['time'] }}" required>
        </div>

        <input type="hidden" name="event_id" value="{{ event_info['id']}}">

        <button class="btn btn-primary m-3" type="submit">Change</button>
    </form>

{% endblock %}
